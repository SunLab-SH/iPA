# UPSNet Configuration File
# Network Configuration
network:
  pretrained: ''
  use_pretrained: false
  backbone_fix_bn: true
  backbone_with_dilation: false
  backbone_with_dpyramid: false
  backbone_with_dconv: 100
  backbone_freeze_at: 2
  use_caffe_model: true
  use_syncbn: false
  
  has_rcnn: true
  has_rpn: true
  has_mask_head: true
  has_fcn_head: false
  has_panoptic_head: false
  
  # Freeze Configuration
  fpn_freeze: false
  rpn_freeze: false 
  backbone_freeze: false
  rcnn_freeze: false
  mask_freeze: false
  
  pixel_means: [102.9801, 115.9465, 122.7717]
  
  cls_agnostic_bbox_reg: false
  rcnn_feat_stride: 32
  bbox_reg_weights: [10.0, 10.0, 5.0, 5.0]
  
  # RPN
  rpn_feat_stride: [4, 8, 16, 32, 64]
  anchor_ratios: [0.5, 1, 2]
  anchor_scales: [8]
  num_anchors: 3
  rpn_with_norm: 'none'
  
  # FPN
  fpn_feature_dim: 256
  fpn_upsample_method: 'nearest'
  fpn_with_norm: 'none'
  
  # RCNN
  rcnn_with_norm: 'none'
  
  # Mask RCNN
  mask_size: 28
  binary_thresh: 0.5
  has_mask_rcnn: true 
  
  # FCN
  fcn_with_norm: 'none'
  fcn_num_layers: 3

# Dataset Configuration
dataset:
  dataset: 'CocoDataset'
  image_set: 'train'
  test_image_set: 'val'
  root_path: ''
  dataset_path: ''
  num_classes: 2  # Background + Cell
  num_seg_classes: 2

# Training Configuration
train:
  use_horovod: false
  lr_schedule: 'step'
  flip: true
  shuffle: true
  resume: false
  begin_iteration: 0
  eval_data: true
  batch_size: 2  # Single GPU batch size
  
  momentum: 0.9
  wd: 0.0001
  lr: 0.001
  max_iteration: 10000
  display_iter: 100
  snapshot_step: 1000
  warmup_iteration: 500
  decay_iteration: [7000, 9000]
  
  # Loss weights
  fcn_loss_weight: 1.0
  fcn_with_roi_loss: false
  panoptic_loss_weight: 1.0
  bbox_loss_weight: 1.0
  
  # RCNN
  batch_rois: 512
  fg_fraction: 0.25
  fg_thresh: 0.5
  bg_thresh_hi: 0.5
  bg_thresh_lo: 0.0
  bbox_regression_thresh: 0.5
  bbox_weights: [1.0, 1.0, 1.0, 1.0]
  
  # RPN
  rpn_batch_size: 256
  rpn_fg_fraction: 0.5
  rpn_clobber_positive: false
  rpn_individual_proposals: true
  rpn_straddle_thresh: 0
  rpn_bbox_weights: [1.0, 1.0, 1.0, 1.0]
  rpn_positive_weight: -1.0
  
  # RPN proposal
  rpn_pre_nms_top_n: 2000
  rpn_post_nms_top_n: 2000
  rpn_min_size: 0
  bbox_normalization_precomputed: true
  bbox_means: [0.0, 0.0, 0.0, 0.0]
  bbox_stds: [0.1, 0.1, 0.2, 0.2]
  crowd_filter_thresh: 0.7
  gt_min_area: -1
  bbox_thresh: 0.5
  
  fcn_with_negative_loss: false
  fcn_use_focal_loss: false
  fcn_focal_loss_gamma: 1.0
  panoptic_with_roi_loss: false
  panoptic_use_focal_loss: false
  panoptic_focal_loss_gamma: 1.0

# Test Configuration
test:
  vis_mask: false
  rpn_nms_thresh: 0.7
  rpn_pre_nms_top_n: 1000
  rpn_post_nms_top_n: 1000
  rpn_min_size: 0
  max_det: 100
  panoptic_score_thresh: 0.6
  panoptic_stuff_area_limit: 4096